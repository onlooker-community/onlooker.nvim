name: Tests

on:
    push:
    pull_request:

jobs:
    tests:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        concurrency:
            group: ${{ format('{0}:{1}:{2}', github.workflow, github.repository, github.ref) }}
            cancel-in-progress: true
        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install Neovim
              run: sudo apt-get update && sudo apt-get install -y neovim
            
            - name: Fetch mini.nvim
              run: git clone --branch "v0.17.0" --depth 1 https://github.com/echasnovski/mini.nvim "${GITHUB_WORKSPACE}/.ci/mini.nvim"

            - name: Run tests
              env:
                MINI_PATH: ${{ github.workspace }}/.ci/mini.nvim
              run: nvim --headless -u tests/minimal_init.lua -c "lua MiniTest.run({})" -c "qa"